# Verificación exclusiva de ROM y materiales oficiales de 0.17. Nunca republica releases ni escribe en main.
name: Verificar Halcones Estelares GB v0.17
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publicar-gb-v017.yml'
      - 'rom/**'
      - 'src/**'
      - 'docs/**'
      - 'portada/**'
      - 'SHA256SUMS.txt'
      - 'Makefile'
  pull_request:
    paths:
      - '.github/workflows/publicar-gb-v017.yml'
      - 'rom/**'
      - 'src/**'
      - 'docs/**'
      - 'portada/**'
      - 'SHA256SUMS.txt'
      - 'Makefile'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar integridad de ROM 0.17 y materiales vigentes
        run: |
          set -euo pipefail
          sha256sum -c SHA256SUMS.txt
          echo "e263b5fa77a78e483857f3d200a35cd81f5bd2053db0172575ce12403af07e8c  rom/Halcones-Estelares-GB-0.17.gb" | sha256sum -c -
          test -f src/main.c
          test -f Makefile
