name: Publicar Halcones Estelares GB v0.14

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publicar-gb-v014.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: halcones-estelares-gb-v014-release
  cancel-in-progress: false

jobs:
  release:
    name: Verificar ROM y publicar v0.14
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout de la edición 0.14
        uses: actions/checkout@v4

      - name: Comprobar SHA-256 de ROM, manual, atlas y carátula
        shell: bash
        run: sha256sum -c SHA256SUMS.txt

      - name: Preparar archivos descargables
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "rom/Halcones-Estelares-GB-0.14.gb" dist/
          cp "docs/Manual-ilustrado-GB-0.14.pdf" dist/
          cp "docs/Atlas-y-memoria-GB-0.14.pdf" dist/
          cp "portada/Halcones_Estelares_GB_Caratula_Oficial.png" dist/
          zip -9 -j "dist/HALCONES_ESTELARES_GB_0_14_JUEGO_Y_DOCUMENTACION.zip" \
            "rom/Halcones-Estelares-GB-0.14.gb" \
            "docs/Manual-ilustrado-GB-0.14.pdf" \
            "docs/Atlas-y-memoria-GB-0.14.pdf" \
            "portada/Halcones_Estelares_GB_Caratula_Oficial.png"
          (cd dist && sha256sum *.gb *.pdf *.png *.zip > SHA256_RELEASE_v0.14.txt)

      - name: Publicar Release v0.14 sin sobrescribir otra
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view "v0.14" >/dev/null 2>&1; then
            echo "La Release v0.14 ya existe; no se sobrescribe."
            exit 0
          fi
          gh release create "v0.14" dist/* \
            --target "${GITHUB_SHA}" \
            --title "Halcones Estelares GB — v0.14" \
            --notes-file "RELEASE_NOTES_v0.14.md" \
            --latest
