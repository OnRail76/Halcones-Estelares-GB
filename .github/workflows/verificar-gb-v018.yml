# Verifica la edición final v0.18 sin volver a publicarla ni alterar la ROM.
name: Verificar Halcones Estelares GB v0.18 — Cañón de Plasma

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verificar-gb-v018.yml'
      - 'rom/**'
      - 'src/**'
      - 'docs/**'
      - 'portada/**'
      - 'SHA256SUMS.txt'
      - 'README.md'
      - 'Makefile'
  pull_request:
    paths:
      - '.github/workflows/verificar-gb-v018.yml'
      - 'rom/**'
      - 'src/**'
      - 'docs/**'
      - 'portada/**'
      - 'SHA256SUMS.txt'
      - 'README.md'
      - 'Makefile'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar los seis archivos actuales
        run: |
          set -euo pipefail
          sha256sum -c SHA256SUMS.txt
          echo 'a9cb44a5b985d15906857c51d6985e93173b65ff8e0f82253614fceb9a8ac393  rom/Halcones-Estelares-GB-0.18.gb' | sha256sum -c -
          test -f src/main.c
          test -f src/audio.h
          test -f Makefile
          test -f docs/Atlas-y-memoria-GB-0.18.pdf
          test -f docs/Manual-ilustrado-GB-0.18.pdf
          grep -q 'noise_hold==0x83' src/audio.h
          ! test -f rom/Halcones-Estelares-GB-0.17.gb
          echo 'HALCONES ESTELARES GB 0.18: INTEGRIDAD CONFIRMADA'
