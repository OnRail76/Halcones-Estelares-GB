name: Publicar Halcones Estelares GB v0.16

on:
  push:
    branches: [main]
    paths:
      - "rom/Halcones-Estelares-GB-0.16.gb"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: halcones-estelares-gb-v016
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verificar ficheros exactos
        run: sha256sum -c SHA256SUMS.txt
      - name: Construir el ZIP de jugadores y las sumas de integridad
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp rom/Halcones-Estelares-GB-0.16.gb dist/
          cp docs/Manual-ilustrado-GB-0.16.pdf dist/
          cp docs/Atlas-y-memoria-GB-0.16.pdf dist/
          cp portada/Halcones_Estelares_GB_Caratula_Oficial.png dist/
          (cd dist && zip -9 HALCONES_ESTELARES_GB_0_16_JUEGO_Y_DOCUMENTACION.zip *.gb *.pdf *.png)
          (cd dist && sha256sum *.gb *.pdf *.png *.zip > SHA256_RELEASE_v0.16.txt)
      - name: Crear y verificar la Release antes de retirar versiones antiguas
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view v0.16 >/dev/null 2>&1; then
            gh release upload v0.16 dist/* --clobber
            gh release edit v0.16 --title "Halcones Estelares GB — v0.16" --notes-file RELEASE_NOTES_v0.16.md --latest
          else
            gh release create v0.16 dist/* --target "${GITHUB_SHA}" --title "Halcones Estelares GB — v0.16" --notes-file RELEASE_NOTES_v0.16.md --latest
          fi
          for file in dist/*; do
            name=$(basename "$file")
            if ! gh release view v0.16 --json assets --jq '.assets[].name' | grep -Fxq "$name"; then
              echo "No se encuentra en la Release: $name" >&2
              exit 1
            fi
          done
          echo "v0.16 completa y verificada."
          gh api "repos/${GH_REPO}/releases" --paginate --jq '.[].tag_name' | while IFS= read -r tag; do
            [ "$tag" = v0.16 ] && continue
            [ -z "$tag" ] && continue
            echo "Eliminando Release reemplazada: $tag"
            gh release delete "$tag" --yes --cleanup-tag
          done
