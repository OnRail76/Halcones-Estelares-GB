name: Cerrar repaso documental definitivo v0.18

on:
  push:
    branches: [main]
    paths:
      - '.github/activar-repaso-definitivo.trigger'

permissions:
  contents: write

concurrency:
  group: halcones-gb-cierre-repaso-v018
  cancel-in-progress: false

jobs:
  completar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      CLEAN_SHA: 'd626611f069c255ff50090d118f4a035ba73616e'
      ROM_SHA: 'a9cb44a5b985d15906857c51d6985e93173b65ff8e0f82253614fceb9a8ac393'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validar código y documentos definitivos
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse --verify "$CLEAN_SHA^{commit}"
          sha256sum -c SHA256SUMS.txt
          echo "$ROM_SHA  rom/Halcones-Estelares-GB-0.18.gb" | sha256sum -c -
          for name in README.md LEEME.md LICENSE LICENCIA_GRAFICOS.md; do
            test -f "$name"
          done
          for old in HISTORIA.md BANDA_SONORA.md CAMBIOS_0.18.md CHANGELOG.md RELEASE_NOTES_v0.18.md LICENSE_ES.md SHA256.txt; do
            test ! -f "$old"
          done
          test -f docs/Manual-ilustrado-GB-0.18.pdf
          test -f docs/Atlas-y-memoria-GB-0.18.pdf
          test -f portada/Halcones_Estelares_GB_Caratula_Oficial.png
          test -f src/main.c
          test -f src/audio.h

      - name: Crear paquete de la edición depurada, sin herramientas temporales
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          git archive --format=zip --prefix="Halcones-GameBoy/" -o dist/Halcones-Estelares-GameBoy-0.18.zip "$CLEAN_SHA"
          unzip -tqq dist/Halcones-Estelares-GameBoy-0.18.zip
          for name in README.md LEEME.md LICENSE LICENCIA_GRAFICOS.md; do
            unzip -Z -1 dist/Halcones-Estelares-GameBoy-0.18.zip | grep -Fxq "Halcones-GameBoy/$name"
          done
          for old in HISTORIA.md BANDA_SONORA.md CAMBIOS_0.18.md CHANGELOG.md RELEASE_NOTES_v0.18.md LICENSE_ES.md SHA256.txt; do
            if unzip -Z -1 dist/Halcones-Estelares-GameBoy-0.18.zip | grep -Fxq "Halcones-GameBoy/$old"; then
              echo "Archivo anticuado en ZIP: $old" >&2
              exit 1
            fi
          done
          unzip -p dist/Halcones-Estelares-GameBoy-0.18.zip Halcones-GameBoy/rom/Halcones-Estelares-GB-0.18.gb | sha256sum | grep -Fq "$ROM_SHA"
          cp rom/Halcones-Estelares-GB-0.18.gb dist/
          cp docs/Manual-ilustrado-GB-0.18.pdf dist/
          cp docs/Atlas-y-memoria-GB-0.18.pdf dist/
          cp portada/Halcones_Estelares_GB_Caratula_Oficial.png dist/
          (cd dist && sha256sum Halcones-Estelares-GameBoy-0.18.zip Halcones-Estelares-GB-0.18.gb Manual-ilustrado-GB-0.18.pdf Atlas-y-memoria-GB-0.18.pdf Halcones_Estelares_GB_Caratula_Oficial.png > SHA256_RELEASE_v0.18.txt)
          (cd dist && sha256sum -c SHA256_RELEASE_v0.18.txt)

      - name: Actualizar ZIP y notas de la Release definitiva
        shell: bash
        run: |
          set -euo pipefail
          gh release view v0.18 >/dev/null
          gh release upload v0.18 dist/Halcones-Estelares-GameBoy-0.18.zip dist/SHA256_RELEASE_v0.18.txt --clobber
          cat >/tmp/notas-finales.md <<'NOTAS'
          # Halcones Estelares GB v0.18 — Cañón de Plasma (Versión Final)

          **Edición definitiva de Game Boy clásica**, © 2026 Tony C. Ware.

          La ESF-01 incorpora el Cañón de Plasma: un chasquido eléctrico seguido de un soplido grave y seco. **ROM idéntica a la versión aprobada**, sin cambios de gráficos, música ni jugabilidad.

          Descargas: ROM de 32 KiB, ZIP del proyecto completo, manual ilustrado (9 páginas), atlas visual (12 páginas), carátula oficial y sumas SHA-256.

          **El ZIP contiene únicamente la documentación principal: README (historia, instrucciones, música y cambios), LEEME (memoria técnica), LICENSE (MIT del código y herramientas) y LICENCIA_GRAFICOS (condiciones del arte).** Incluye además el código, recursos, capturas y archivos técnicos necesarios.

          **SHA-256 ROM:** a9cb44a5b985d15906857c51d6985e93173b65ff8e0f82253614fceb9a8ac393

          Proyecto independiente, no oficial. Código MIT; recursos artísticos sujetos a condiciones propias.
          NOTAS
          gh release edit v0.18 --title 'Halcones Estelares GB — v0.18 · Cañón de Plasma (Versión Final)' --notes-file /tmp/notas-finales.md --latest
          for name in Halcones-Estelares-GB-0.18.gb Halcones-Estelares-GameBoy-0.18.zip Manual-ilustrado-GB-0.18.pdf Atlas-y-memoria-GB-0.18.pdf Halcones_Estelares_GB_Caratula_Oficial.png SHA256_RELEASE_v0.18.txt; do
            gh release view v0.18 --json assets --jq '.assets[].name' | grep -Fxq "$name"
          done
          zip_digest="$(gh api "repos/$GH_REPO/releases/tags/v0.18" --jq '.assets[] | select(.name=="Halcones-Estelares-GameBoy-0.18.zip") | .digest')"
          test "$zip_digest" = "sha256:$(sha256sum dist/Halcones-Estelares-GameBoy-0.18.zip | cut -d' ' -f1)"
          rom_digest="$(gh api "repos/$GH_REPO/releases/tags/v0.18" --jq '.assets[] | select(.name=="Halcones-Estelares-GB-0.18.gb") | .digest')"
          test "$rom_digest" = "sha256:$ROM_SHA"

      - name: Reorientar etiqueta v0.18 al código documental definitivo
        shell: bash
        run: |
          set -euo pipefail
          before="$(gh api "repos/$GH_REPO/git/ref/tags/v0.18" --jq '.object.sha')"
          case "$before" in
            "$CLEAN_SHA") ;;
            "2c64db4b4cff23c5f2b86d5d10aa009106cd02b1")
              gh api --method PATCH "repos/$GH_REPO/git/refs/tags/v0.18" -f sha="$CLEAN_SHA" -F force=true >/dev/null ;;
            *) echo "La etiqueta ha cambiado inesperadamente ($before); no se toca" >&2; exit 1 ;;
          esac
          test "$(gh api "repos/$GH_REPO/git/ref/tags/v0.18" --jq '.object.sha')" = "$CLEAN_SHA"
          test "$(gh api "repos/$GH_REPO/releases" --jq 'length')" = "1"
          test "$(gh api "repos/$GH_REPO/releases/latest" --jq '.tag_name')" = "v0.18"
          echo 'Repaso definitivo completo; una sola Release y etiqueta, ROM intacta.'
