name: Depuración definitiva de Halcones GB v0.18

on:
  push:
    branches: [main]
    paths:
      - '.github/limpieza-v018.trigger'

permissions:
  contents: write

concurrency:
  group: limpieza-halcones-gb-v018-final
  cancel-in-progress: false

jobs:
  limpiar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      CLEAN_REF: '2c64db4b4cff23c5f2b86d5d10aa009106cd02b1'
      ROM_SHA: 'a9cb44a5b985d15906857c51d6985e93173b65ff8e0f82253614fceb9a8ac393'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Comprobar la edición final
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse "$CLEAN_REF^{commit}")" = "$CLEAN_REF"
          sha256sum -c SHA256SUMS.txt
          echo "$ROM_SHA  rom/Halcones-Estelares-GB-0.18.gb" | sha256sum -c -
          git show "$CLEAN_REF:rom/Halcones-Estelares-GB-0.18.gb" | sha256sum | grep -Fq "$ROM_SHA"
          test -f docs/Manual-ilustrado-GB-0.18.pdf
          test -f docs/Atlas-y-memoria-GB-0.18.pdf
          test -f portada/Halcones_Estelares_GB_Caratula_Oficial.png
      - name: Crear ZIP limpio desde el código oficial
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp rom/Halcones-Estelares-GB-0.18.gb dist/
          cp docs/Manual-ilustrado-GB-0.18.pdf dist/
          cp docs/Atlas-y-memoria-GB-0.18.pdf dist/
          cp portada/Halcones_Estelares_GB_Caratula_Oficial.png dist/
          git archive --format=zip --prefix="Halcones-GameBoy/" -o dist/Halcones-Estelares-GameBoy-0.18.zip "$CLEAN_REF"
          unzip -p dist/Halcones-Estelares-GameBoy-0.18.zip Halcones-GameBoy/rom/Halcones-Estelares-GB-0.18.gb | sha256sum | grep -Fq "$ROM_SHA"
          if unzip -Z -1 dist/Halcones-Estelares-GameBoy-0.18.zip | grep -E '(^|/)(0\.16|0\.17|CAMBIOS_0\.17|RELEASE_NOTES_v0\.17|VERIFICACION_PFF_RUIDO|efectos-gb\.wav|publicar_v018\.py)' ; then
            echo 'ERROR: material obsoleto en el ZIP' >&2
            exit 1
          fi
          (cd dist && sha256sum Halcones-Estelares-GB-0.18.gb Halcones-Estelares-GameBoy-0.18.zip Manual-ilustrado-GB-0.18.pdf Atlas-y-memoria-GB-0.18.pdf Halcones_Estelares_GB_Caratula_Oficial.png > SHA256_RELEASE_v0.18.txt)
          (cd dist && sha256sum -c SHA256_RELEASE_v0.18.txt)
      - name: Sustituir solo ZIP y manifest de la Release final
        shell: bash
        run: |
          set -euo pipefail
          gh release view v0.18 >/dev/null
          gh release upload v0.18 dist/Halcones-Estelares-GameBoy-0.18.zip dist/SHA256_RELEASE_v0.18.txt --clobber
          gh release edit v0.18 --title "Halcones Estelares GB — v0.18 · Cañón de Plasma (Versión Final)" --notes-file RELEASE_NOTES_v0.18.md --latest
          for name in Halcones-Estelares-GB-0.18.gb Halcones-Estelares-GameBoy-0.18.zip Manual-ilustrado-GB-0.18.pdf Atlas-y-memoria-GB-0.18.pdf Halcones_Estelares_GB_Caratula_Oficial.png SHA256_RELEASE_v0.18.txt; do
            gh release view v0.18 --json assets --jq '.assets[].name' | grep -Fxq "$name"
          done
      - name: Eliminar Releases y etiquetas v0.16 y v0.17
        shell: bash
        run: |
          set -euo pipefail
          for tag in v0.16 v0.17; do
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release delete "$tag" --yes --cleanup-tag
            fi
            if gh api "repos/$GH_REPO/git/ref/tags/$tag" >/dev/null 2>&1; then
              gh api -X DELETE "repos/$GH_REPO/git/refs/tags/$tag"
            fi
          done
          test "$(gh api "repos/$GH_REPO/releases" --jq 'length')" = "1"
          test "$(gh api "repos/$GH_REPO/releases" --jq '.[0].tag_name')" = "v0.18"
      - name: Alinear etiqueta v0.18 con el commit limpio
        shell: bash
        run: |
          set -euo pipefail
          current="$(gh api "repos/$GH_REPO/git/ref/tags/v0.18" --jq '.object.sha')"
          case "$current" in
            "$CLEAN_REF") ;;
            "0660b31ac73dfcc6628c60739fe750ea90bfd175")
              gh api --method PATCH "repos/$GH_REPO/git/refs/tags/v0.18" -f sha="$CLEAN_REF" -F force=true >/dev/null ;;
            *) echo "Etiqueta v0.18 inesperada, no se modificará: $current" >&2;exit 1 ;;
          esac
          test "$(gh api "repos/$GH_REPO/git/ref/tags/v0.18" --jq '.object.sha')" = "$CLEAN_REF"
          test "$(gh api "repos/$GH_REPO/git/refs/tags" --jq 'length')" = "1"
          test "$(gh api "repos/$GH_REPO/releases/latest" --jq '.tag_name')" = "v0.18"
          echo 'Única Release y etiqueta: v0.18. ROM definitiva intacta.'
